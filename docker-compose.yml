version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: servicehive_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicehive_backend
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/servicehive-leads
      - JWT_SECRET=supersecretjwtkeythatshouldbechangedinproduction
      - JWT_EXPIRES_IN=30d
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servicehive_frontend
    ports:
      - '5173:5173'
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

volumes:
  mongodb_data:
